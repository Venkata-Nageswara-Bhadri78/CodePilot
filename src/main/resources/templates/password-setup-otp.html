<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Set up your password</title>
</head>

<body style="font-family:Arial,sans-serif;background:#f5f5f5;padding:40px;">

<div style="max-width:600px;
            margin:auto;
            background:white;
            border-radius:10px;
            padding:30px;">

    <h2>AI Copilot</h2>

    <p>Hello <span th:text="${name}"></span>,</p>

    <p>Use this code to set a password for your account. After that you can sign in with Google or with email and password.</p>

    <h1 style="letter-spacing:8px;color:#2563eb;"
        th:text="${otp}">
    </h1>

    <p>This code will expire in <strong th:text="${expiryMinutes}">10</strong> minutes.</p>

    <hr>

    <p style="font-size:12px;color:gray;">
        If you didn't ask to set a password,
        you may safely ignore this email.
    </p>

</div>

</body>
</html>
