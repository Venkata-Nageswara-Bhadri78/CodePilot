<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Password Reset</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f6f8fb; margin: 0; padding: 0;">
<div style="max-width: 600px; margin: 0 auto; padding: 24px;">
    <div style="background: #ffffff; border-radius: 12px; padding: 32px; border: 1px solid #e5e7eb;">
        <h2 style="margin-top: 0;">Reset your password</h2>

        <p>Hi <strong th:text="${name}">User</strong>,</p>

        <p>We received a request to reset your password for your AI Copilot account.</p>

        <p style="margin: 24px 0;">
            Your password reset token is:
        </p>

        <div style="font-size: 24px; font-weight: bold; letter-spacing: 4px; text-align: center; padding: 16px; background: #f3f4f6; border-radius: 10px;">
            <span th:text="${token}">RESET-TOKEN</span>
        </div>

        <p style="margin-top: 24px;">
            This token will expire in <strong th:text="${expiryMinutes}">15</strong> minutes.
        </p>

        <p style="margin-top: 28px; color: #6b7280; font-size: 13px;">
            If you did not request this reset, you can ignore this email.
        </p>
    </div>
</div>
</body>
</html>
